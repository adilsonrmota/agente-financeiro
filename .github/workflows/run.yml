name: Agente Financeiro

on:
  schedule:
    - cron: '0 10 * * *'  # roda todo dia (UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Criar arquivos secretos
        run: |
          echo "${{ secrets.GOOGLE_CREDENTIALS }}" > credentials.json
          echo "${{ secrets.TOKEN_GMAIL }}" > token.json
          echo "${{ secrets.TOKEN_CALENDAR }}" > token_calendar.json
          echo "CPF=${{ secrets.CPF }}" > .env

      - name: Rodar sistema
        run: python main.py

      - name: Commitar estado (processados)
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          touch processados.json
          git add processados.json
          git commit -m "Atualiza processados [auto]" || echo "Sem mudanças"
          git push